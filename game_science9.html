<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>من سيربح المليون - علوم التاسع السوري</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#07152f;color:#fff}
body{background:radial-gradient(circle at 50% 10%,#174b91,#06122b 65%);padding:10px}
*{box-sizing:border-box}.app{max-width:600px;margin:auto}.logo{text-align:center;font-size:29px;font-weight:900;color:#ffd43b;padding:15px 0;text-shadow:0 0 12px #ff9d00}
.card{background:#071a39e8;border:2px solid #4c86d1;border-radius:20px;padding:14px;box-shadow:0 8px 30px #0008}
.ladder{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:14px}
.ladder div{background:#102d57;border-radius:8px;padding:7px;font-size:14px;text-align:center}
.ladder .active{background:#f4b400;color:#111;font-weight:bold}
.question{background:#0d2850;border:2px solid #5b91d4;border-radius:16px;padding:20px 12px;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;line-height:1.5;margin-bottom:12px}
.answers{display:grid;gap:9px}.ans{width:100%;background:#102f5d;color:white;border:2px solid #5688c7;border-radius:13px;padding:13px;text-align:right;font-size:17px}.ans:active{transform:scale(.98)}.correct{background:#17834b!important}.wrong{background:#a52e2e!important}
.buttons{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:13px}.btn{background:#eab000;border:0;border-radius:11px;padding:10px 14px;font-weight:bold;font-size:15px}.btn:disabled{opacity:.35}
.start{text-align:center}.start button{font-size:21px;padding:15px 30px}
.hidden{display:none}.result{text-align:center;padding:25px}.million{font-size:31px;color:#ffd43b}
</style>
</head>
<body>
<div class="app">
<div class="logo">🏆 من سيربح المليون</div>
<div id="screen" class="card">
  <div id="ladder" class="ladder"></div>
  <div id="q" class="question">اختبر معلوماتك في علوم الصف التاسع السوري</div>
  <div id="answers" class="answers"></div>
  <div class="buttons">
    <button id="fifty" class="btn" onclick="fifty()">50:50</button>
    <button id="skip" class="btn" onclick="skip()">تغيير السؤال</button>
  </div>
  <div class="buttons start"><button class="btn" onclick="start()">▶ ابدأ اللعبة</button></div>
</div>
<div id="result" class="card result hidden"></div>
</div>
<script>
const data=[
["ما الوحدة الأساسية في بناء الكائن الحي؟",["النسيج","الخلية","العضو","الجهاز"],1],
["ما العضو الذي يضخ الدم إلى أنحاء الجسم؟",["الرئة","الكبد","القلب","الكلية"],2],
["أي جهاز مسؤول عن تنسيق نشاطات الجسم والاستجابة للمؤثرات؟",["العصبي","الهضمي","التنفسي","البولي"],0],
["أين يحدث تبادل الغازات في الرئتين؟",["القصبة","الحويصلات الرئوية","الحنجرة","البلعوم"],1],
["أي عنصر يدخل في تركيب الهيموغلوبين؟",["الكالسيوم","الحديد","اليود","الصوديوم"],1],
["ما الوظيفة الأساسية للكلية؟",["ضخ الدم","تنقية الدم وتكوين البول","هضم الطعام","التنفس"],1],
["أين توجد المادة الوراثية في الخلية حقيقية النواة؟",["النواة","الفجوة","الجدار","السيتوبلازم فقط"],0],
["ما المادة التي تحمل المعلومات الوراثية؟",["DNA","ATP","الغلوكوز","الماء"],0],
["ما العظم الذي يحمي الدماغ؟",["الفخذ","القص","الجمجمة","الحوض"],2],
["أي نوع من المفاصل يوجد بين عظام الجمجمة؟",["ثابت","كروي","رزي","محوري"],0],
["أي هرمون يخفض مستوى سكر الدم؟",["الأنسولين","الأدرينالين","الثيروكسين","هرمون النمو"],0],
["أين توجد الغدة الدرقية؟",["العنق","البطن","الكلية","الدماغ"],0],
["ما الغاز الضروري للتنفس الخلوي؟",["النيتروجين","الأكسجين","ثاني أكسيد الكربون","الهيدروجين"],1],
["أي جهاز ينقل الأكسجين والمواد الغذائية إلى الخلايا؟",["الجهاز الدوراني","الجهاز الهيكلي","الجهاز العصبي","الجهاز التنفسي"],0],
["ما اسم منطقة الاتصال بين عصبونين؟",["المشبك","الوتر","المفصل","الرباط"],0],
["ما العضلة التي تفصل الصدر عن البطن وتساعد في التنفس؟",["الحجاب الحاجز","عضلة القلب","العضلة ذات الرأسين","عضلة الفخذ"],0],
["أي مكوّن من الدم مسؤول أساساً عن التخثر؟",["الكريات الحمراء","الصفيحات","البلازما فقط","الكريات البيضاء"],1],
["ما وظيفة الكريات الحمراء؟",["الدفاع","نقل الأكسجين","التخثر","إنتاج الهرمونات"],1],
["ما الجزء الذي ينظم دخول المواد إلى الخلية وخروجها؟",["الغشاء الخلوي","النواة","الجدار","الفجوة"],0],
["أي جهاز مسؤول عن هضم الطعام وامتصاص المغذيات؟",["الهضمي","العصبي","الدوراني","الهيكلي"],0]
];
const prizes=["1,000,000","500,000","250,000","125,000","64,000","32,000","16,000","8,000","4,000","2,000","1,000","500","300","200","100"];
let order=[],pos=0,used50=false,usedSkip=false,locked=false;
function $(x){return document.getElementById(x)}
function mix(a){return a.sort(()=>Math.random()-.5)}
function drawLadder(){ $("ladder").innerHTML=prizes.map((p,n)=>`<div class="${n===14-pos?'active':''}">${15-n}. ${p}</div>`).join('') }
function start(){order=mix([...Array(data.length).keys()]);pos=0;used50=false;usedSkip=false;locked=false;$("fifty").disabled=false;$("skip").disabled=false;$("result").className="card result hidden";$("screen").className="card";draw();scrollTo(0,0)}
function draw(){drawLadder();let x=data[order[pos]];$("q").textContent=`السؤال ${pos+1}: ${x[0]}`;$("answers").innerHTML=x[1].map((a,n)=>`<button class="ans" onclick="choose(${n})">${String.fromCharCode(65+n)}. ${a}</button>`).join('')}
function choose(n){if(locked)return;locked=true;let x=data[order[pos]],b=[...document.querySelectorAll('.ans')];b[n].classList.add(n===x[2]?'correct':'wrong');setTimeout(()=>{if(n!==x[2])finish(false);else if(pos===14)finish(true);else{pos++;locked=false;draw()}},650)}
function fifty(){if(used50)return;used50=true;$("fifty").disabled=true;let x=data[order[pos]],wrong=mix([0,1,2,3].filter(n=>n!==x[2])).slice(0,2);wrong.forEach(n=>document.querySelectorAll('.ans')[n].style.visibility='hidden')}
function skip(){if(usedSkip)return;usedSkip=true;$("skip").disabled=true;pos++;if(pos>14)finish(true);else draw()}
function finish(win){$("screen").className="card hidden";$("result").className="card result";$("result").innerHTML=win?'<div class="million">🎉 مليون مبروك!</div><p>أجبت عن جميع الأسئلة بشكل صحيح.</p>':'<div class="million">انتهت اللعبة</div><p>إجابتك الأخيرة كانت غير صحيحة.</p><button class="btn" onclick="start()">🔄 العب من جديد</button>'}
drawLadder();
</script>
</body>
</html>
